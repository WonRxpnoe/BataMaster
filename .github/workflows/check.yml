name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned rather than ubuntu-latest, so a runner image rollout cannot break the
    # build on a day nobody touched the code
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is what runs locally; the ceiling catches deprecations early
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m pyflakes *.py
          python -m pycodestyle *.py

      - name: Test
        run: python -m pytest -q
